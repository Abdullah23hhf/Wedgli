name: Add author and dates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  byline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add author, dates and About section
        run: python3 add_byline.py --site . --inplace --updated 2026-10-24
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add author and dates to guides"
          git push
